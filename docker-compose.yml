version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: karaoq-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=False
      - CORS_ORIGINS=*
      - DEMUCS_MODEL=htdemucs
      - DEMUCS_TWO_STEMS=vocals
      - DEMUCS_DEVICE=auto
      - DEMUCS_MP3_BITRATE=320
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      # Volume persistente para manter uploads e áudios separados
      - ./backend/storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
